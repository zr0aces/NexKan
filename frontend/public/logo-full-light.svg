<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 512" fill="none">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA600" />
      <stop offset="50%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#E63900" />
    </linearGradient>
  </defs>

  <!-- Icon Symbol on Left -->
  <g transform="translate(48, 16) scale(0.9375)">
    <!-- Outer Hexagonal Frame -->
    <path
      d="M 256,56 L 440,168 L 440,360 L 256,472 L 72,360 L 72,168 Z"
      stroke="url(#brand-grad)"
      stroke-width="28"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Vertical Column Dividers (detached from shield) -->
    <line
      x1="204"
      y1="160"
      x2="204"
      y2="390"
      stroke="url(#brand-grad)"
      stroke-width="8"
      stroke-linecap="round"
    />
    <line
      x1="308"
      y1="160"
      x2="308"
      y2="390"
      stroke="url(#brand-grad)"
      stroke-width="8"
      stroke-linecap="round"
    />

    <!-- Horizontal Column Header Dividers (detached from shield and dividers) -->
    <line
      x1="116"
      y1="188"
      x2="196"
      y2="188"
      stroke="url(#brand-grad)"
      stroke-width="8"
      stroke-linecap="round"
    />
    <line
      x1="216"
      y1="188"
      x2="296"
      y2="188"
      stroke="url(#brand-grad)"
      stroke-width="8"
      stroke-linecap="round"
    />
    <line
      x1="316"
      y1="188"
      x2="396"
      y2="188"
      stroke="url(#brand-grad)"
      stroke-width="8"
      stroke-linecap="round"
    />

    <!-- 4 Kanban Cards -->
    <rect x="126" y="212" width="58" height="52" rx="8" fill="#FFFFFF" />
    <rect x="227" y="212" width="58" height="52" rx="8" fill="#FFFFFF" />
    <rect x="328" y="212" width="58" height="52" rx="8" fill="#FFFFFF" />
    <rect x="227" y="282" width="58" height="52" rx="8" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <text x="560" y="266" font-family="'Inter', 'Prompt', 'Kanit', -apple-system, sans-serif" font-weight="900" font-size="240" dominant-baseline="central">
    <tspan fill="#0F172A">Nex</tspan><tspan fill="#FF6B00">Kan</tspan>
  </text>
</svg>
